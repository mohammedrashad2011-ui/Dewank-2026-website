name: Refine Riyadh English landing page
on:
  push:
    branches:
      - preview/riyadh-english-commercial-page-aug30
permissions:
  contents: write
jobs:
  refine:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/riyadh-english-commercial-page-aug30
      - name: Refine brand, copy and language signals
        shell: python
        run: |
          from pathlib import Path

          page = Path('app/en/riyadh-marketing-agency/page.tsx')
          text = page.read_text()

          replacements = {
            '      ar: `${siteUrl}/services`,\n': '',
            '    a: "Dewank serves companies in Riyadh and across Saudi Arabia through a remote-first delivery model. We do not present a physical Riyadh office unless one is established; projects are managed through clear milestones, calls and digital collaboration.",': '    a: "Dewank works with businesses in Riyadh and across Saudi Arabia through a remote-first delivery model, with structured calls, clear milestones and digital collaboration from kickoff through delivery.",',
            '<Link className="re-brand" href="/" aria-label="Dewank home"><span aria-hidden="true" />DEWANK</Link>': '<Link className="re-brand re-brand-lockup" href="/" aria-label="Dewank home"><img src="/dewank-logo.png" alt="Dewank" /></Link>',
            '<p className="re-location-note">Serving Riyadh and Saudi Arabia through a remote-first delivery model. No false local-office claims.</p>': '<p className="re-location-note">Serving businesses in Riyadh and across Saudi Arabia through a remote-first delivery model.</p>',
            '<div><span className="re-label">RIYADH / SAUDI ARABIA</span><h2>Built for the market.<br/><em>Without pretending proximity is strategy.</em></h2></div>': '<div><span className="re-label">RIYADH / SAUDI ARABIA</span><h2>Built for the market.<br/><em>Designed around the customer journey.</em></h2></div>',
            '<p>For Riyadh searches, this page is intentionally commercial: if you are comparing a marketing agency, digital marketing partner or branding agency, you can see the operating model before starting a conversation.</p>': '<p>If you are comparing a marketing agency, digital marketing partner or branding agency in Riyadh, our model is built around one thing: connecting strategy and execution to measurable commercial outcomes.</p>',
            '<span>{service.no}</span><h3>{service.title}</h3><p>{service.text}</p><b>Explore capability ↗</b>': '<span>{service.no}</span><h3>{service.title}</h3><p>{service.text}</p><b>View service details <small>(Arabic page)</small> ↗</b>',
            '<footer className="re-footer"><div className="re-shell"><Link className="re-brand" href="/"><span aria-hidden="true" />DEWANK</Link>': '<footer className="re-footer"><div className="re-shell"><Link className="re-brand re-brand-lockup" href="/" aria-label="Dewank home"><img src="/dewank-logo.png" alt="Dewank" /></Link>',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing page marker: {old[:90]}')
              text = text.replace(old, new, 1)

          page.write_text(text)

          css = Path('app/en/riyadh-marketing-agency/riyadh-marketing-agency.css')
          styles = css.read_text()
          styles = styles.replace('font-family:Arial,Helvetica,sans-serif;text-align:left', 'font-family:var(--font-arabic),Arial,Helvetica,sans-serif;text-align:left', 1)
          styles = styles.replace('.re-brand{font-weight:800;letter-spacing:.16em;font-size:14px;display:inline-flex;align-items:center;gap:10px}.re-brand span{width:24px;height:24px;border:1px solid var(--re-text);border-radius:7px;display:inline-block;position:relative}.re-brand span:after{content:"";position:absolute;inset:6px;border:1px solid var(--re-accent);border-radius:3px}', '.re-brand{display:inline-flex;align-items:center}.re-brand-lockup{background:#f4f1e8;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:6px 10px;line-height:0}.re-brand-lockup img{display:block;height:38px;width:auto;max-width:160px;object-fit:contain}', 1)
          styles = styles.replace("font-family:Georgia,'Times New Roman',serif;font-weight:500", "font-family:var(--font-display),Georgia,'Times New Roman',serif;font-weight:600", 1)
          styles = styles.replace("font-family:Georgia,'Times New Roman',serif;font-size:48px", "font-family:var(--font-display),Georgia,'Times New Roman',serif;font-size:48px", 1)
          styles += '\n.re-service-card b small{font-size:10px;font-weight:500;color:var(--re-muted);letter-spacing:0}.re-service-card:hover b small{color:var(--re-text)}@media(max-width:640px){.re-brand-lockup{padding:5px 8px}.re-brand-lockup img{height:32px;max-width:138px}}\n'
          css.write_text(styles)

      - name: Verify targeted refinements
        shell: bash
        run: |
          grep -q 'src="/dewank-logo.png"' app/en/riyadh-marketing-agency/page.tsx
          grep -q 'Serving businesses in Riyadh and across Saudi Arabia through a remote-first delivery model.' app/en/riyadh-marketing-agency/page.tsx
          grep -q 'Designed around the customer journey.' app/en/riyadh-marketing-agency/page.tsx
          grep -q 'View service details <small>(Arabic page)</small>' app/en/riyadh-marketing-agency/page.tsx
          ! grep -q 'No false local-office claims' app/en/riyadh-marketing-agency/page.tsx
          ! grep -q 'For Riyadh searches, this page is intentionally commercial' app/en/riyadh-marketing-agency/page.tsx
          ! grep -q 'ar: `${siteUrl}/services`' app/en/riyadh-marketing-agency/page.tsx
      - name: Commit refinement
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/en/riyadh-marketing-agency/page.tsx app/en/riyadh-marketing-agency/riyadh-marketing-agency.css
          git commit -m 'refine Riyadh English page brand and copy'
          git push
