name: Patch Riyadh English page references
on:
  push:
    branches:
      - preview/riyadh-english-commercial-page-aug30
permissions:
  contents: write
jobs:
  patch:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/riyadh-english-commercial-page-aug30
      - name: Patch sitemap and services link
        shell: python
        run: |
          from pathlib import Path

          sitemap = Path('app/sitemap.ts')
          text = sitemap.read_text()
          marker = '    { path: "/ai-automation", priority: 0.9, changeFrequency: "monthly" as const },'
          addition = marker + '\n    { path: "/en/riyadh-marketing-agency", priority: 0.85, changeFrequency: "monthly" as const },'
          if '/en/riyadh-marketing-agency' not in text:
              if marker not in text:
                  raise SystemExit('sitemap marker not found')
              text = text.replace(marker, addition, 1)
              sitemap.write_text(text)

          services = Path('app/services/page.tsx')
          text = services.read_text()
          if 'Marketing Agency Riyadh ↗' not in text:
              marker = '        </div>\n      </section>\n\n      <section className="shell primary-service-paths" aria-labelledby="primary-paths-title">'
              replacement = '        </div>\n        <p className="services-decision-note">تبحث عن شريك تسويق باللغة الإنجليزية في الرياض؟ <Link href="/en/riyadh-marketing-agency">Marketing Agency Riyadh ↗</Link></p>\n      </section>\n\n      <section className="shell primary-service-paths" aria-labelledby="primary-paths-title">'
              if marker not in text:
                  raise SystemExit('services marker not found')
              text = text.replace(marker, replacement, 1)
              services.write_text(text)
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/sitemap.ts app/services/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "seo: index and internally link Riyadh English page"
          git push
