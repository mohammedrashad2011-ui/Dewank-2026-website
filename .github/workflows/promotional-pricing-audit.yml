name: Promotional pricing source audit
on:
  push:
    branches: [feat/year-end-promotional-pricing]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read-only source inventory
        run: node scripts/qa/pricing-inventory.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test central pricing and market parity
        run: node --experimental-strip-types --test tests/promotional-pricing.test.mjs
