name: Promotional pricing source audit
on:
  push:
    branches: [feat/year-end-promotional-pricing]
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  inventory:
    if: github.event_name == 'push' || github.head_ref == 'feat/year-end-promotional-pricing'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read-only source inventory
        run: node scripts/qa/pricing-inventory.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test campaign snapshot
        env:
          NEXT_PUBLIC_DEWANK_PRICING_SNAPSHOT: campaign
        run: node --experimental-strip-types --test tests/promotional-pricing.test.mjs
      - name: Test regular snapshot
        env:
          NEXT_PUBLIC_DEWANK_PRICING_SNAPSHOT: regular
        run: node --experimental-strip-types --test tests/promotional-pricing.test.mjs
  build-snapshots:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/year-end-promotional-pricing'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        snapshot: [campaign, regular]
    env:
      NEXT_PUBLIC_DEWANK_PRICING_SNAPSHOT: ${{ matrix.snapshot }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build standalone Next.js artifact without deployment
        run: npm run build
      - name: Verify served HTML and uncached pricing snapshot
        shell: bash
        run: |
          set -euo pipefail
          HOSTNAME=127.0.0.1 PORT=3217 node .next/standalone/server.js > /tmp/dewank-pricing-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/dewank-pricing-server.log' EXIT
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3217/api/pricing-snapshot >/dev/null; then break; fi
            kill -0 "$server_pid"
            sleep 1
          done
          node --experimental-strip-types scripts/qa/check-pricing-snapshot.mjs
