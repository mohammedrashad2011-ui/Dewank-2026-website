name: Refresh security lockfile

on:
  push:
    branches:
      - preview/security-deps-aug29
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    if: ${{ !contains(github.event.head_commit.message, 'chore(lock)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/security-deps-aug29
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Refresh lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify patched versions
        run: |
          node - <<'NODE'
          const lock = require('./package-lock.json');
          const p = lock.packages;
          const expected = {
            'node_modules/js-yaml': '4.3.1',
            'node_modules/fast-uri': '3.1.5',
            'node_modules/brace-expansion': '1.1.18',
            'node_modules/nanoid': '3.3.18'
          };
          for (const [key, version] of Object.entries(expected)) {
            if (!p[key] || p[key].version !== version) {
              throw new Error(`${key}: expected ${version}, got ${p[key]?.version}`);
            }
          }
          console.log('Security versions verified');
          NODE
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Lockfile already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(lock): refresh patched security dependencies'
          git push
