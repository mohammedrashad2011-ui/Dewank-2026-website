name: Diagnose Webpack Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Webpack
        run: npm run build

      - name: Smoke test production server
        run: |
          npm run start > /tmp/dewank-next.log 2>&1 &
          pid=$!
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then
              kill "$pid" || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/dewank-next.log
          kill "$pid" || true
          exit 1
