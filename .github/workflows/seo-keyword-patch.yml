name: Apply SEO keyword map patches
on:
  push:
    branches:
      - preview/seo-keyword-map-aug30
permissions:
  contents: write
jobs:
  patch:
    if: "github.actor != 'github-actions[bot]'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/seo-keyword-map-aug30
      - name: Patch existing pages
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'pattern missing: {path}')
              p.write_text(s.replace(old,new,1))

          rep('app/services/page.tsx', 'title: "خدمات التسويق الرقمي للشركات في السعودية | ديوانك"', 'title: "شركة تسويق ووكالة تسويق في السعودية | خدمات ديوانك"')
          rep('app/services/page.tsx', 'description: "خدمات ديوانك للشركات في السعودية والخليج: إدارة الإعلانات، تصميم المواقع وSEO، إدارة المحتوى، أتمتة واتساب والذكاء الاصطناعي، البراندينج والتحليلات ضمن منظومة نمو واحدة."', 'description: "ديوانك شركة تسويق ووكالة تسويق في السعودية والخليج تجمع الاستراتيجية والإعلانات والمحتوى وتصميم المواقع وSEO والبراندينج وأتمتة واتساب والذكاء الاصطناعي ضمن منظومة نمو واحدة."')
          rep('app/services/page.tsx', '    "خدمات التسويق الرقمي في السعودية",\n    "شركة تسويق رقمي في السعودية",', '    "شركة تسويق",\n    "وكالة تسويق",\n    "شركة تسويق في السعودية",\n    "وكالة تسويق في السعودية",\n    "خدمات التسويق الرقمي في السعودية",\n    "شركة تسويق رقمي في السعودية",')
          rep('app/services/page.tsx', '<h2 id="services-aeo-title">ماذا تقدم ديوانك للشركات؟</h2>\n        <p>ديوانك تجمع التسويق والويب والقياس والأتمتة في منظومة واحدة، لكن نقطة البداية تتحدد حسب المشكلة التي تمنع النمو الآن.</p>', '<h2 id="services-aeo-title">شركة تسويق متكاملة أم خدمات منفصلة؟</h2>\n        <p>ديوانك شركة تسويق ووكالة تسويق تخدم الشركات في السعودية والخليج عبر منظومة واحدة تجمع الاستراتيجية والإعلانات والمحتوى والويب والقياس والأتمتة. نبدأ من نقطة الاختناق التي تمنع النمو، ثم نختار الخدمة الأقرب للنتيجة بدل بيع باقة أكبر من الحاجة.</p>')

          rep('app/digital-marketing/page.tsx', 'title: "التسويق الرقمي وصناعة المحتوى في السعودية | ديوانك"', 'title: "التسويق الإلكتروني واستراتيجية التسويق الرقمي | ديوانك"')
          rep('app/digital-marketing/page.tsx', '"استراتيجية تسويق رقمي وصناعة محتوى للشركات في السعودية والخليج تربط الرسالة بالقنوات ورحلة العميل والقياس لتحويل الانتباه إلى طلب."', '"خدمات التسويق الإلكتروني واستراتيجية التسويق الرقمي للشركات في السعودية والخليج: خطة تسويقية، محتوى، رحلة عميل، قنوات وقياس لتحويل الانتباه إلى طلب."')
          rep('app/digital-marketing/page.tsx', '    "التسويق الرقمي في السعودية",\n    "صناعة المحتوى للشركات",\n    "استراتيجية محتوى",\n    "خطة تسويق رقمي",', '    "التسويق الإلكتروني",\n    "التسويق الرقمي في السعودية",\n    "استراتيجية التسويق",\n    "استراتيجية التسويق الرقمي",\n    "خطة تسويقية",\n    "خطة تسويق رقمي",\n    "صناعة المحتوى للشركات",\n    "استراتيجية محتوى",')
          rep('app/digital-marketing/page.tsx', '<p>نبني استراتيجية تسويق رقمي وصناعة محتوى تربط أهداف النشاط، سلوك الجمهور، الرسالة، القنوات، ورحلة التحويل في نظام واحد قابل للقياس.</p>', '<p>نبني استراتيجية تسويق رقمي وخطة تسويقية تربط أهداف النشاط وسلوك الجمهور والرسالة والقنوات وصناعة المحتوى ورحلة التحويل في نظام واحد قابل للقياس، بحيث يصبح التسويق الإلكتروني أقرب لقرار تجاري من مجرد جدول نشر.</p>')

          rep('app/guides/choose-digital-marketing-company-saudi-arabia/page.tsx', 'keywords: ["شركة تسويق رقمي في السعودية", "أفضل شركة تسويق في السعودية", "اختيار وكالة تسويق", "شركات التسويق الإلكتروني", "وكالة تسويق رقمي", "التسويق الرقمي للشركات"]', 'keywords: ["كيف تختار شركة تسويق", "أفضل شركة تسويق في السعودية", "معايير اختيار وكالة تسويق", "اختيار وكالة تسويق", "تقييم شركات التسويق", "التسويق الرقمي للشركات"]')
          rep('app/guides/choose-digital-marketing-company-saudi-arabia/page.tsx', '<div className="article-answer"><p>اختر شركة التسويق التي تفهم اقتصاد نشاطك ورحلة عميلك، تحدد مؤشرات مرتبطة بالمبيعات، تقدم نطاقًا وفريقًا واضحين، وتترك الحسابات والبيانات تحت ملكيتك. العروض الأرخص أو الأكثر ازدحامًا بالخدمات ليست بالضرورة الأفضل.</p></div>', '<div className="article-answer"><p>اختر شركة التسويق التي تفهم اقتصاد نشاطك ورحلة عميلك، تحدد مؤشرات مرتبطة بالمبيعات، تقدم نطاقًا وفريقًا واضحين، وتترك الحسابات والبيانات تحت ملكيتك. العروض الأرخص أو الأكثر ازدحامًا بالخدمات ليست بالضرورة الأفضل.</p></div>\n          <p>إذا كنت تقارن بين نطاقات التنفيذ نفسها، ابدأ من <Link href="/services">صفحة خدمات ديوانك كشركة تسويق ووكالة تسويق في السعودية</Link> لفهم الفرق بين مسارات الإعلانات والمحتوى والمواقع والبراند والأتمتة، ثم استخدم هذا الدليل لتقييم الجهة المناسبة.</p>')

          rep('app/guides/page.tsx', 'const guides = [\n  {\n    category: "GOOGLE ADS · CONVERSION",', 'const guides = [\n  {\n    category: "MARKETING PLAN · STRATEGY",\n    title: "نموذج خطة تسويقية جاهزة للشركات: الخطوات والمكونات",\n    description: "نموذج عملي يربط الهدف والجمهور والعرض والقنوات والمحتوى والميزانية ومؤشرات الأداء في خطة واحدة قابلة للتنفيذ.",\n    href: "/guides/marketing-plan-template",\n  },\n  {\n    category: "MARKETING KPIs · MEASUREMENT",\n    title: "مؤشرات الأداء في التسويق: أهم KPIs للشركات",\n    description: "كيف تختار مؤشرات التسويق التي تقيس الطلب والتحويل وتكلفة الاكتساب والإيراد بدل الاكتفاء بأرقام الوصول والتفاعل.",\n    href: "/guides/marketing-kpis",\n  },\n  {\n    category: "GOOGLE ADS · CONVERSION",')

          rep('app/sitemap.ts', '    { path: "/guides", priority: 0.8, changeFrequency: "weekly" as const },\n', '    { path: "/guides", priority: 0.8, changeFrequency: "weekly" as const },\n    { path: "/guides/marketing-plan-template", priority: 0.75, changeFrequency: "monthly" as const },\n    { path: "/guides/marketing-kpis", priority: 0.75, changeFrequency: "monthly" as const },\n')
          PY
      - name: Commit patches
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/services/page.tsx app/digital-marketing/page.tsx app/guides/choose-digital-marketing-company-saudi-arabia/page.tsx app/guides/page.tsx app/sitemap.ts
          git commit -m 'seo(preview): align keyword ownership and internal links'
          git push
