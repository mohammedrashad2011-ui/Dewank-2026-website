name: Build SEO keyword preview

on:
  push:
    branches:
      - preview/seo-keyword-map-aug30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-seo-preview:
    if: ${{ !contains(github.event.head_commit.message, 'seo(preview)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/seo-keyword-map-aug30
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Apply targeted SEO changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Pattern not found in {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          # /services owns commercial agency terms.
          replace('app/services/page.tsx',
          '  title: "خدمات التسويق الرقمي للشركات في السعودية | ديوانك",\n  description: "خدمات ديوانك للشركات في السعودية والخليج: إدارة الإعلانات، تصميم المواقع وSEO، إدارة المحتوى، أتمتة واتساب والذكاء الاصطناعي، البراندينج والتحليلات ضمن منظومة نمو واحدة.",',
          '  title: "شركة تسويق ووكالة تسويق في السعودية | خدمات ديوانك",\n  description: "ديوانك شركة تسويق ووكالة تسويق في السعودية والخليج تجمع الاستراتيجية والإعلانات والمحتوى وتصميم المواقع وSEO والبراندينج وأتمتة واتساب والذكاء الاصطناعي ضمن منظومة نمو واحدة.",')
          replace('app/services/page.tsx',
          '    "خدمات التسويق الرقمي في السعودية",\n    "شركة تسويق رقمي في السعودية",',
          '    "شركة تسويق",\n    "وكالة تسويق",\n    "شركة تسويق في السعودية",\n    "وكالة تسويق في السعودية",\n    "خدمات التسويق الرقمي في السعودية",\n    "شركة تسويق رقمي في السعودية",')
          replace('app/services/page.tsx',
          '<h2 id="services-aeo-title">ماذا تقدم ديوانك للشركات؟</h2>\n        <p>ديوانك تجمع التسويق والويب والقياس والأتمتة في منظومة واحدة، لكن نقطة البداية تتحدد حسب المشكلة التي تمنع النمو الآن.</p>',
          '<h2 id="services-aeo-title">شركة تسويق متكاملة أم خدمات منفصلة؟</h2>\n        <p>ديوانك شركة تسويق ووكالة تسويق تخدم الشركات في السعودية والخليج عبر منظومة واحدة تجمع الاستراتيجية والإعلانات والمحتوى والويب والقياس والأتمتة. نبدأ من نقطة الاختناق التي تمنع النمو، ثم نختار الخدمة الأقرب للنتيجة بدل بيع باقة أكبر من الحاجة.</p>')

          # /digital-marketing owns broader strategy terms.
          replace('app/digital-marketing/page.tsx',
          '  title: "التسويق الرقمي وصناعة المحتوى في السعودية | ديوانك",\n  description:\n    "استراتيجية تسويق رقمي وصناعة محتوى للشركات في السعودية والخليج تربط الرسالة بالقنوات ورحلة العميل والقياس لتحويل الانتباه إلى طلب.",',
          '  title: "التسويق الإلكتروني واستراتيجية التسويق الرقمي | ديوانك",\n  description:\n    "خدمات التسويق الإلكتروني واستراتيجية التسويق الرقمي للشركات في السعودية والخليج: خطة تسويقية، محتوى، رحلة عميل، قنوات وقياس لتحويل الانتباه إلى طلب.",')
          replace('app/digital-marketing/page.tsx',
          '    "التسويق الرقمي في السعودية",\n    "صناعة المحتوى للشركات",\n    "استراتيجية محتوى",\n    "خطة تسويق رقمي",',
          '    "التسويق الإلكتروني",\n    "التسويق الرقمي في السعودية",\n    "استراتيجية التسويق",\n    "استراتيجية التسويق الرقمي",\n    "خطة تسويقية",\n    "خطة تسويق رقمي",\n    "صناعة المحتوى للشركات",\n    "استراتيجية محتوى",')
          replace('app/digital-marketing/page.tsx',
          '<p>نبني استراتيجية تسويق رقمي وصناعة محتوى تربط أهداف النشاط، سلوك الجمهور، الرسالة، القنوات، ورحلة التحويل في نظام واحد قابل للقياس.</p>',
          '<p>نبني استراتيجية تسويق رقمي وخطة تسويقية تربط أهداف النشاط وسلوك الجمهور والرسالة والقنوات وصناعة المحتوى ورحلة التحويل في نظام واحد قابل للقياس، بحيث يصبح التسويق الإلكتروني أقرب لقرار تجاري من مجرد جدول نشر.</p>')

          # Informational guide supports /services rather than competing with it.
          replace('app/guides/choose-digital-marketing-company-saudi-arabia/page.tsx',
          '  keywords: ["شركة تسويق رقمي في السعودية", "أفضل شركة تسويق في السعودية", "اختيار وكالة تسويق", "شركات التسويق الإلكتروني", "وكالة تسويق رقمي", "التسويق الرقمي للشركات"],',
          '  keywords: ["كيف تختار شركة تسويق", "أفضل شركة تسويق في السعودية", "معايير اختيار وكالة تسويق", "اختيار وكالة تسويق", "تقييم شركات التسويق", "التسويق الرقمي للشركات"],')
          replace('app/guides/choose-digital-marketing-company-saudi-arabia/page.tsx',
          '<div className="article-answer"><p>اختر شركة التسويق التي تفهم اقتصاد نشاطك ورحلة عميلك، تحدد مؤشرات مرتبطة بالمبيعات، تقدم نطاقًا وفريقًا واضحين، وتترك الحسابات والبيانات تحت ملكيتك. العروض الأرخص أو الأكثر ازدحامًا بالخدمات ليست بالضرورة الأفضل.</p></div>',
          '<div className="article-answer"><p>اختر شركة التسويق التي تفهم اقتصاد نشاطك ورحلة عميلك، تحدد مؤشرات مرتبطة بالمبيعات، تقدم نطاقًا وفريقًا واضحين، وتترك الحسابات والبيانات تحت ملكيتك. العروض الأرخص أو الأكثر ازدحامًا بالخدمات ليست بالضرورة الأفضل.</p></div>\n          <p>إذا كنت تقارن بين نطاقات التنفيذ نفسها، ابدأ من <Link href="/services">صفحة خدمات ديوانك كشركة تسويق ووكالة تسويق في السعودية</Link> لفهم الفرق بين مسارات الإعلانات والمحتوى والمواقع والبراند والأتمتة، ثم استخدم هذا الدليل لتقييم الجهة المناسبة.</p>')

          # New guide: marketing plan template.
          Path('app/guides/marketing-plan-template').mkdir(parents=True, exist_ok=True)
          Path('app/guides/marketing-plan-template/page.tsx').write_text(r'''import type { Metadata } from "next";
